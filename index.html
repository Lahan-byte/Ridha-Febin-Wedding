      <div class="flower-cluster flower-right" aria-hidden="true">
        <svg viewBox="0 0 260 320" role="img" aria-label="Decorative floral arrangement">
          <g fill="none" stroke-linecap="round" stroke-linejoin="round">
            <g>
              <path d="M130 65 C112 100, 110 130, 123 160 C138 188, 172 212, 194 262" stroke="#2d5d34" stroke-width="5" fill="none"/>
              <path d="M110 90 C78 100, 62 120, 58 148 C54 176, 68 204, 96 214" stroke="#2d5d34" stroke-width="4" fill="none"/>
              <path d="M156 89 C188 93, 207 109, 216 142 C225 176, 212 204, 184 220" stroke="#2d5d34" stroke-width="4" fill="none"/>
            </g>
            <g fill="#7a0f1f">
              <ellipse cx="120" cy="82" rx="25" ry="36" transform="rotate(-25 120 82)"/>
              <ellipse cx="111" cy="102" rx="25" ry="38" transform="rotate(-55 111 102)"/>
              <ellipse cx="149" cy="84" rx="25" ry="38" transform="rotate(30 149 84)"/>
              <ellipse cx="154" cy="103" rx="25" ry="39" transform="rotate(60 154 103)"/>
              <ellipse cx="131" cy="68" rx="24" ry="33"/>
            </g>
            <g fill="#f8f5f0">
              <ellipse cx="120" cy="176" rx="26" ry="38" transform="rotate(-30 120 176)"/>
              <ellipse cx="112" cy="198" rx="27" ry="40" transform="rotate(-62 112 198)"/>
              <ellipse cx="152" cy="177" rx="27" ry="40" transform="rotate(30 152 177)"/>
              <ellipse cx="156" cy="198" rx="27" ry="40" transform="rotate(60 156 198)"/>
              <ellipse cx="133" cy="158" rx="24" ry="33"/>

            <g fill="#d7c8b8">

              <circle cx="178" cy="120" r="8"/>
              <circle cx="100" cy="214" r="7"/>
              <circle cx="179" cy="214" r="7"/>
            </g>
            <g fill="#2d5d34">
              <ellipse cx="75" cy="142" rx="12" ry="32" transform="rotate(-20 75 142)"/>
              <ellipse cx="188" cy="145" rx="12" ry="32" transform="rotate(20 188 145)"/>

          </g>
        </svg>
      </div>

      <main class="invitation-card" aria-label="Wedding invitation card">
        <div class="card-inner">
          <div class="bismillah reveal-up">بِسْمِ ٱللّٰهِ الرَّحْمٰنِ الرَّحِيمِ</div>

          <p class="line-intro reveal-up" style="--delay: 0.15s;">
            MR.ABDUL KADER &amp; MRS.SULFATH<br />
            REQUEST THE HONOUR OF YOUR PRESENCE AT THE
          </p>

          <h1 class="reveal-up" style="--delay: 0.3s;">Wedding Ceremony</h1>

          <div class="of-text reveal-up" style="--delay: 0.45s;">OF</div>

          <div class="names-block reveal-up" style="--delay: 0.6s;">
            <div class="name name-left">Ridha Febin</div>
            <div class="ampersand">&amp;</div>
            <div class="name name-right">Muhammed Roshan</div>
          </div>

          <div class="date-row reveal-up" aria-label="Wedding date" style="--delay: 0.75s;">
            <span>SATURDAY</span>
            <strong>14</strong>
            <span>NOVEMBER</span>
          </div>

          <div class="time-text reveal-up" style="--delay: 0.9s;">12:00 PM ONWARDS</div>

          <div class="venue-text reveal-up" style="--delay: 1.05s;">
            C MOYINKUTTY CONVENTION CENTRE<br />
            ANDONA, THAMARASSERY
          </div>
        </div>
      </main>

      <div class="countdown-wrap reveal-up" aria-label="Countdown to wedding" style="--delay: 1.2s;">
        <h2>Counting down to our day</h2>
        <div class="countdown" id="countdown">
          <div class="timer-box">
            <span id="days">00</span>
            <label>Days</label>
          </div>
          <div class="timer-box">
            <span id="hours">00</span>
            <label>Hours</label>
          </div>
          <div class="timer-box">
            <span id="minutes">00</span>
            <label>Minutes</label>
          </div>
          <div class="timer-box">
            <span id="seconds">00</span>
            <label>Seconds</label>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
